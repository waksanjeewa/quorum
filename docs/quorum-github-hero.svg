<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Quorum</title>
  <desc id="desc">Many models working together at a roundtable, then building and merging verified code.</desc>
  <defs>
    <linearGradient id="cool" x1="110" y1="86" x2="230" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset=".52" stop-color="#0EA5A4"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="920" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0F12"/>
      <stop offset=".62" stop-color="#0D1718"/>
      <stop offset="1" stop-color="#06201C"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.062 0 0 0 0 0.725 0 0 0 0 0.506 0 0 0 .35 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="920" height="420" rx="34" fill="url(#hero)"/>
  <circle cx="188" cy="138" r="118" fill="#10B981" opacity=".08"/>
  <circle cx="735" cy="72" r="170" fill="#22D3EE" opacity=".06"/>
  <path d="M48 318 C210 235 308 369 470 287 C610 216 690 229 872 143" fill="none" stroke="#22D3EE" stroke-opacity=".12" stroke-width="2"/>

  <g transform="translate(104 72)" filter="url(#glow)">
    <path d="M64 18 102.8 41.7 102.8 86.3 64 110 25.2 86.3 25.2 41.7Z" fill="none" stroke="url(#cool)" stroke-width="3" stroke-linejoin="round" opacity=".65"/>
    <g stroke="#0A0F12" stroke-width="2" stroke-linejoin="round">
      <path d="M64 64 64 38 85.5 50.5Z" fill="#10B981"/>
      <path d="M64 64 85.5 50.5 85.5 77.5Z" fill="#0EA5A4"/>
      <path d="M64 64 85.5 77.5 64 90Z" fill="#22D3EE"/>
      <path d="M64 64 64 90 42.5 77.5Z" fill="#0EA5A4"/>
      <path d="M64 64 42.5 77.5 42.5 50.5Z" fill="#10B981"/>
      <path d="M64 64 42.5 50.5 64 38Z" fill="#22D3EE"/>
    </g>
    <circle cx="64" cy="18" r="7" fill="#10B981"/>
    <circle cx="102.8" cy="41.7" r="7.5" fill="#F59E0B"/>
    <circle cx="102.8" cy="86.3" r="7" fill="#22D3EE"/>
    <circle cx="64" cy="110" r="7" fill="#0EA5A4"/>
    <circle cx="25.2" cy="86.3" r="7" fill="#22D3EE"/>
    <circle cx="25.2" cy="41.7" r="7" fill="#10B981"/>
  </g>

  <g transform="translate(270 84)">
    <text x="0" y="62" fill="#E6F1EE" font-family="Inter, Geist, Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="68" font-weight="720" letter-spacing="-2">Quorum</text>
    <text x="3" y="104" fill="#8FA3A0" font-family="Inter, Geist, Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="22">Many models, working together.</text>
    <rect x="4" y="130" width="86" height="30" rx="15" fill="#F59E0B" fill-opacity=".12" stroke="#F59E0B" stroke-opacity=".62"/>
    <text x="47" y="151" text-anchor="middle" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">v0.8.0</text>
    <rect x="102" y="130" width="220" height="30" rx="15" fill="#10B981" fill-opacity=".12" stroke="#10B981" stroke-opacity=".45"/>
    <text x="212" y="151" text-anchor="middle" fill="#10B981" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">local-first · private</text>
  </g>

  <g font-family="Inter, Geist, Avenir Next, Helvetica Neue, Arial, sans-serif">
    <g transform="translate(70 292)">
      <rect width="170" height="74" rx="18" fill="#101719" stroke="#20312F"/>
      <circle cx="26" cy="26" r="7" fill="#10B981"/>
      <text x="44" y="31" fill="#E6F1EE" font-size="18" font-weight="700">Goal</text>
      <text x="26" y="56" fill="#8FA3A0" font-size="13">say what to build</text>
    </g>
    <text x="262" y="339" fill="#10B981" font-size="28" font-weight="800">→</text>
    <g transform="translate(300 292)">
      <rect width="190" height="74" rx="18" fill="#101719" stroke="#20312F"/>
      <circle cx="28" cy="26" r="7" fill="#22D3EE"/>
      <circle cx="46" cy="26" r="7" fill="#10B981"/>
      <circle cx="64" cy="26" r="7" fill="#F59E0B"/>
      <text x="84" y="31" fill="#E6F1EE" font-size="18" font-weight="700">Roundtable</text>
      <text x="28" y="56" fill="#8FA3A0" font-size="13">propose · critique · decide</text>
    </g>
    <text x="512" y="339" fill="#0EA5A4" font-size="28" font-weight="800">→</text>
    <g transform="translate(550 292)">
      <rect width="165" height="74" rx="18" fill="#101719" stroke="#20312F"/>
      <path d="M28 25h32M28 37h52M28 49h40" stroke="#22D3EE" stroke-width="3" stroke-linecap="round"/>
      <text x="86" y="31" fill="#E6F1EE" font-size="18" font-weight="700">Workshop</text>
      <text x="28" y="56" fill="#8FA3A0" font-size="13">Codex/Claude build</text>
    </g>
    <text x="738" y="339" fill="#22D3EE" font-size="28" font-weight="800">→</text>
    <g transform="translate(776 292)">
      <rect width="104" height="74" rx="18" fill="#102018" stroke="#F59E0B" stroke-opacity=".5"/>
      <text x="24" y="35" fill="#F59E0B" font-size="24" font-weight="900">✓</text>
      <text x="52" y="33" fill="#E6F1EE" font-size="17" font-weight="700">Merged</text>
      <text x="24" y="56" fill="#8FA3A0" font-size="13">verified</text>
    </g>
  </g>
</svg>
