<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" role="img" aria-labelledby="title desc">
  <title id="title">Quorum</title>
  <desc id="desc">Quorum: many models working together through goal, roundtable, workshop, and verified merge.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="920" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0F12"/>
      <stop offset=".68" stop-color="#0D1718"/>
      <stop offset="1" stop-color="#06221D"/>
    </linearGradient>
    <linearGradient id="cool" x1="54" y1="54" x2="154" y2="154" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset=".52" stop-color="#0EA5A4"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="920" height="310" rx="32" fill="url(#bg)"/>
  <circle cx="174" cy="136" r="128" fill="#10B981" opacity=".08" filter="url(#soft)"/>
  <circle cx="780" cy="48" r="170" fill="#22D3EE" opacity=".055" filter="url(#soft)"/>
  <path d="M44 244 C235 175 346 272 514 207 C640 158 734 151 876 94" fill="none" stroke="#22D3EE" stroke-opacity=".13" stroke-width="2"/>

  <g transform="translate(70 60)">
    <path d="M64 18 102.8 41.7 102.8 86.3 64 110 25.2 86.3 25.2 41.7Z" fill="none" stroke="url(#cool)" stroke-width="3" stroke-linejoin="round" opacity=".7"/>
    <g stroke="#0A0F12" stroke-width="2" stroke-linejoin="round">
      <path d="M64 64 64 38 85.5 50.5Z" fill="#10B981"/>
      <path d="M64 64 85.5 50.5 85.5 77.5Z" fill="#0EA5A4"/>
      <path d="M64 64 85.5 77.5 64 90Z" fill="#22D3EE"/>
      <path d="M64 64 64 90 42.5 77.5Z" fill="#0EA5A4"/>
      <path d="M64 64 42.5 77.5 42.5 50.5Z" fill="#10B981"/>
      <path d="M64 64 42.5 50.5 64 38Z" fill="#22D3EE"/>
    </g>
    <circle cx="64" cy="18" r="7" fill="#10B981"/>
    <circle cx="102.8" cy="41.7" r="7.5" fill="#F59E0B"/>
    <circle cx="102.8" cy="86.3" r="7" fill="#22D3EE"/>
    <circle cx="64" cy="110" r="7" fill="#0EA5A4"/>
    <circle cx="25.2" cy="86.3" r="7" fill="#22D3EE"/>
    <circle cx="25.2" cy="41.7" r="7" fill="#10B981"/>
  </g>

  <g font-family="Inter, Geist, Avenir Next, Helvetica Neue, Arial, sans-serif">
    <text x="222" y="98" fill="#E6F1EE" font-size="64" font-weight="760" letter-spacing="-2">Quorum</text>
    <text x="225" y="133" fill="#8FA3A0" font-size="22">Many models, working together.</text>
    <rect x="226" y="152" width="80" height="30" rx="15" fill="#F59E0B" fill-opacity=".12" stroke="#F59E0B" stroke-opacity=".62"/>
    <text x="266" y="173" text-anchor="middle" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="800">v0.8.0</text>
    <rect x="318" y="152" width="216" height="30" rx="15" fill="#10B981" fill-opacity=".12" stroke="#10B981" stroke-opacity=".45"/>
    <text x="426" y="173" text-anchor="middle" fill="#10B981" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="800">local-first · private</text>
  </g>

  <g transform="translate(88 214)" font-family="Inter, Geist, Avenir Next, Helvetica Neue, Arial, sans-serif">
    <g>
      <rect width="145" height="54" rx="15" fill="#101719" stroke="#20312F"/>
      <circle cx="24" cy="25" r="6" fill="#10B981"/>
      <text x="42" y="27" fill="#E6F1EE" font-size="17" font-weight="780">Goal</text>
      <text x="42" y="44" fill="#8FA3A0" font-size="12.5">say what to build</text>
    </g>
    <text x="166" y="33" fill="#10B981" font-size="22" font-weight="760">→</text>
    <g transform="translate(205)">
      <rect width="185" height="54" rx="15" fill="#101719" stroke="#20312F"/>
      <circle cx="25" cy="24" r="6" fill="#22D3EE"/>
      <circle cx="43" cy="24" r="6" fill="#10B981"/>
      <circle cx="61" cy="24" r="6" fill="#F59E0B"/>
      <text x="80" y="27" fill="#E6F1EE" font-size="17" font-weight="780">Roundtable</text>
      <text x="25" y="44" fill="#8FA3A0" font-size="12.5">propose · critique · decide</text>
    </g>
    <text x="413" y="33" fill="#0EA5A4" font-size="22" font-weight="760">→</text>
    <g transform="translate(452)">
      <rect width="170" height="54" rx="15" fill="#101719" stroke="#20312F"/>
      <path d="M25 20H59M25 29H76M25 38H63" fill="none" stroke="#22D3EE" stroke-width="3" stroke-linecap="round"/>
      <text x="90" y="27" fill="#E6F1EE" font-size="17" font-weight="780">Workshop</text>
      <text x="90" y="44" fill="#8FA3A0" font-size="12.5">build + test</text>
    </g>
    <text x="642" y="33" fill="#22D3EE" font-size="22" font-weight="760">→</text>
    <g transform="translate(680)">
      <rect width="140" height="54" rx="15" fill="#F59E0B" fill-opacity=".08" stroke="#F59E0B" stroke-opacity=".62"/>
      <text x="23" y="31" fill="#F59E0B" font-size="22" font-weight="850">✓</text>
      <text x="50" y="27" fill="#E6F1EE" font-size="17" font-weight="780">Merged</text>
      <text x="50" y="44" fill="#8FA3A0" font-size="12.5">verified</text>
    </g>
